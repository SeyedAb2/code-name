# ============================================================================
#  پیکربندی Nginx برای کدنامه
#  فایل‌ها ساکن‌اند، پس کار اصلی این فایل سه چیز است:
#    ۱) فشرده‌سازی متن  ۲) کش طولانی برای دارایی‌ها  ۳) کش‌نکردن HTML
# ============================================================================
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    charset_types text/css application/javascript text/plain;

    # ---- فشرده‌سازی ----------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript
                      image/svg+xml application/json text/markdown;

    # ---- دارایی‌های نسخه‌دار: کش طولانی --------------------------------------
    # فونت‌ها هرگز عوض نمی‌شوند، پس یک سال کش امن است.
    location ~* \.(woff2|woff|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS و JS ممکن است با هر انتشار عوض شوند — کش کوتاه‌تر با اعتبارسنجی
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    # ---- HTML: هرگز کش نشود --------------------------------------------------
    # وگرنه فصل تازه‌ای که منتشر می‌کنی به دست خواننده نمی‌رسد.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- هدرهای امنیتی پایه --------------------------------------------------
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "no-referrer"    always;

    location / {
        try_files $uri $uri/ =404;
    }

    # ۴۰۴ عمداً به صفحهٔ اصلی هدایت نمی‌شود: این یک سایت تک‌صفحه‌ای نیست و
    # لینک شکسته باید شکسته به نظر برسد، نه اینکه بی‌سروصدا به خانه برگردد.
}
