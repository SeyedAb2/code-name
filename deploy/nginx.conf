# ============================================================================
#  پیکربندی Nginx برای کدنامه
#
#  سایت یک اپ Next.js است که روی پورت ۳۰۰۰ اجرا می‌شود (کانتینر یا systemd).
#  کار این فایل سه چیز است:
#     ۱) رساندن درخواست‌ها به اپ   ۲) کش طولانی برای دارایی‌های نسخه‌دار
#     ۳) فشرده‌سازی و هدرهای امنیتی پایه
#
#  برای HTTPS، certbot خودش بلوک ۴۴۳ را اضافه می‌کند:
#     certbot --nginx -d codenameh.ir -d www.codenameh.ir
# ============================================================================

upstream codenameh_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen       80;
    server_name  codenameh.ir www.codenameh.ir;

    charset utf-8;

    # ---- فشرده‌سازی ----------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   512;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/rss+xml text/xml;

    # ---- هدرهای امنیتی پایه --------------------------------------------------
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;

    # ---- دارایی‌های نسخه‌دار Next: کش یک‌ساله ---------------------------------
    # نام فایل‌ها هش دارد، پس تغییر محتوا یعنی نام تازه. کش امن است.
    location /_next/static/ {
        proxy_pass http://codenameh_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # فونت و لوگو هم عوض نمی‌شوند
    location /assets/ {
        proxy_pass http://codenameh_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- بقیهٔ درخواست‌ها ----------------------------------------------------
    location / {
        proxy_pass http://codenameh_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # بدون این، اپ فکر می‌کند درخواست http بوده و نشانی‌های تولیدی‌اش غلط می‌شود
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
    }

    # صفحهٔ ۴۰۴ عمداً به خانه هدایت نمی‌شود: لینک شکسته باید شکسته به نظر
    # برسد، نه اینکه بی‌سروصدا به صفحهٔ اصلی برگردد.
}
