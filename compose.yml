# ============================================================================
#  کدنامه — بالا آوردن با یک دستور
#
#     docker compose up -d --build
#     مرورگر → http://localhost:8080
#
#     docker compose logs -f          دیدن لاگ
#     docker compose down             خاموش کردن
# ============================================================================
services:
  docs:
    build: .
    image: codenameh:local
    container_name: codenameh

    ports:
      # میزبان:کانتینر — اگر ۸۰۸۰ اشغال بود فقط عدد سمت چپ را عوض کن
      - "8080:80"

    # با ریبوت سرور خودش بالا می‌آید، ولی اگر خودت خاموشش کنی خاموش می‌ماند
    restart: unless-stopped

    # فایل‌ها ساکن‌اند و کانتینر چیزی نمی‌نویسد جز کش موقت Nginx
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    # سقف منابع: این فقط یک وب‌سرور ساکن است و به بیش از این نیاز ندارد
    deploy:
      resources:
        limits:
          memory: 128M
