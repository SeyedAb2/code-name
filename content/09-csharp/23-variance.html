<div class="masthead"><span class="eyebrow"><span class="dot"></span><span lang="fa">C# · فصل ۲۳</span><span lang="en">C# · Chapter 23</span></span><h1 lang="fa">variance در interfaceها</h1><h1 lang="en">Variance in interfaces</h1><p class="sub" lang="fa">تابعی که string می‌سازد برای جایی که object می‌خواهد هم قابل‌استفاده به نظر می‌رسد؛ اما listای که string می‌پذیرد را نمی‌شود هرجا List<object> خواسته‌اند گذاشت. این دو حس متفاوت از جهت داده می‌آیند. variance را با تبدیل‌های امن می‌فهمیم، نه با حفظ‌کردن واژه‌های یونانی.</p><p class="sub" lang="en">A producer of strings seems usable where objects are expected, but a list accepting strings cannot safely stand in for a List&lt;object&gt;. These different intuitions come from data direction. We will understand variance through safe substitutions, not memorised Greek terms.</p><div class="facts"><div class="fact"><div class="fact-v"><b>۶</b><span lang="fa">بخش</span><span lang="en">sections</span></div></div><div class="fact"><div class="fact-v"><b>۱۴</b><span lang="fa">تمرین اجرایی</span><span lang="en">coding exercises</span></div></div><div class="fact"><div class="fact-v"><b>۸۰</b><span lang="fa">دقیقه</span><span lang="en">minutes</span></div></div><div class="fact"><div class="fact-v"><b>فصل ۲۲</b><span lang="fa">پیش‌نیاز</span><span lang="en">prerequisite</span></div></div></div></div>
<section id="problem"><h2><span lang="fa">تولیدکننده و مصرف‌کننده جهت مخالف دارند</span><span lang="en">Producers and consumers face opposite directions</span></h2><p class="lede" lang="fa">یک IEnumerable<string> فقط string بیرون می‌دهد. چون هر string یک object است، مصرف‌کننده‌ای که object می‌خواهد می‌تواند خروجی را بخواند. اما اگر List<string> را به List<object> تبدیل کنیم، آن مصرف‌کننده مجاز می‌شود یک DateTime داخل همان list بنویسد؛ در نتیجه list اصلیِ string خراب می‌شود.</p><p class="lede" lang="en">An IEnumerable&lt;string&gt; only produces strings. Since each string is an object, a consumer expecting objects can safely read them. But if we converted List&lt;string&gt; to List&lt;object&gt;, that consumer could insert a DateTime and corrupt the original string list.</p><div class="term"><div class="term-bar"><span class="dots"><i></i><i></i><i></i></span><span class="term-label">تبدیل امن و ناامن / Safe and unsafe assignments</span><button class="copy">کپی</button></div><pre dir="ltr">IEnumerable&lt;string&gt; names = new[] { "Mina", "Reza" };
IEnumerable&lt;object&gt; values = names; // safe: read-only producer

List&lt;string&gt; mutableNames = new() { "Mina" };
// List&lt;object&gt; mutableValues = mutableNames; // rejected: unsafe writes</pre></div><p lang="fa">IEnumerable<out T> خروجی می‌دهد، پس T covariant است. List<T> هم می‌خواند و هم می‌نویسد، پس invariant می‌ماند؛ compiler نمی‌تواند اجازه دهد نوع گسترده‌تر مقداری ناسازگار بنویسد.</p><p lang="en">IEnumerable&lt;out T&gt; produces values, so T is covariant. List&lt;T&gt; both reads and writes, so it remains invariant; the compiler cannot permit a wider type to write incompatible values.</p></section>
<section id="covariance"><h2><span lang="fa">covariance: مقدار خاص‌تر را به مصرف‌کنندهٔ عمومی‌تر بده</span><span lang="en">Covariance: give a more specific producer to a broader reader</span></h2><p lang="fa">در declaration، out روی پارامتر نوع می‌گوید T فقط در موقعیت خروجی به کار می‌رود. این اجازه می‌دهد رابطی که object بیرون می‌دهد با رابطی که string بیرون می‌دهد سازگار شود؛ رابطهٔ ارث‌بری خود نوع‌هاست که تبدیل را امن می‌کند.</p><p lang="en">In a declaration, out says T is used only in output positions. This allows an interface producing objects to accept one producing strings; the types’ own inheritance relationship makes that conversion safe.</p><div class="term"><div class="term-bar"><span class="dots"><i></i><i></i><i></i></span><span class="term-label">تولیدکنندهٔ covariant</span><button class="copy">کپی</button></div><pre dir="ltr">interface ISource&lt;out T&gt;
{
    T Get();
}

sealed class StringSource : ISource&lt;string&gt;
{
    public string Get() =&gt; "hello";
}

ISource&lt;string&gt; strings = new StringSource();
ISource&lt;object&gt; objects = strings;
Console.WriteLine(objects.Get());</pre></div><p lang="fa">در زمان اجرا همان StringSource است؛ فقط قرارداد مصرف‌کننده گسترده‌تر شده. out اجازه نمی‌دهد متدی با ورودی T به interface اضافه کنیم، چون مصرف‌کنندهٔ ISource<object> ممکن است object دلخواه بدهد که منبع string نمی‌تواند بپذیرد.</p><p lang="en">At runtime it is still the same StringSource; only the consumer-facing contract is broader. out prevents adding a method that accepts T, because a consumer of ISource&lt;object&gt; could pass an arbitrary object that a string source cannot accept.</p></section>
<section id="contravariance"><h2><span lang="fa">contravariance: مصرف‌کنندهٔ عمومی‌تر را برای ورودی خاص‌تر به‌کار ببر</span><span lang="en">Contravariance: use a broader consumer for a more specific input</span></h2><p lang="fa">in روی T یعنی interface آن را ورودی می‌گیرد. عملیاتی که هر object را می‌پذیرد، می‌تواند string را هم بپذیرد؛ پس مصرف‌کنندهٔ object در جای مصرف‌کنندهٔ string امن است.</p><p lang="en">in means the interface consumes T as input. An operation accepting any object can also accept a string, so an object consumer is safe where a string consumer is needed.</p><div class="term"><div class="term-bar"><span class="dots"><i></i><i></i><i></i></span><span class="term-label">مصرف‌کنندهٔ contravariant</span><button class="copy">کپی</button></div><pre dir="ltr">interface IHandler&lt;in T&gt;
{
    void Handle(T item);
}

sealed class ObjectHandler : IHandler&lt;object&gt;
{
    public void Handle(object item) =&gt; Console.WriteLine(item);
}

IHandler&lt;object&gt; allObjects = new ObjectHandler();
IHandler&lt;string&gt; strings = allObjects;
strings.Handle("hello");</pre></div><p lang="fa">اگر جهت را برعکس کنیم، handler مخصوص string را به IHandler<object> بدهیم، caller مجاز است عدد هم بفرستد؛ پس تبدیل ناامن است و compiler رد می‌کند.</p><p lang="en">Reversing the direction—using a string-only handler as IHandler&lt;object&gt;—would allow callers to pass numbers, so the compiler rejects it.</p></section>
<section id="delegates"><h2><span lang="fa">delegateها هم جهت ورودی و خروجی دارند</span><span lang="en">Delegates also have input and output directions</span></h2><p lang="fa">Func<TArg,TResult> آرگومان می‌گیرد و نتیجه می‌دهد؛ پس TArg در جهت ورودی و TResult در جهت خروجی است. Action<T> مصرف‌کننده است. variance امضا را جادویی عوض نمی‌کند؛ فقط assignment امن بین generic interface/delegateها را ممکن می‌کند.</p><p lang="en">Func&lt;TArg,TResult&gt; accepts an argument and returns a result, so TArg is input and TResult is output. Action&lt;T&gt; is a consumer. Variance does not magically rewrite signatures; it permits safe assignments between generic interfaces/delegates.</p><div class="term"><div class="term-bar"><span class="dots"><i></i><i></i><i></i></span><span class="term-label">ورودی و خروجی Func / Func input and output</span><button class="copy">کپی</button></div><pre dir="ltr">Func&lt;string&gt; makeText = () =&gt; "done";
Func&lt;object&gt; makeObject = makeText;

Action&lt;object&gt; logAnything = value =&gt; Console.WriteLine(value);
Action&lt;string&gt; logText = logAnything;</pre></div><p lang="fa">Func<string> را می‌توان در Func<object> گذاشت چون خروجی خاص‌تر به خروجی عمومی‌تر می‌رود. Action<object> را می‌توان Action<string> دانست چون ورودی عمومی‌تر را می‌پذیرد. اگر امضا چند ورودی/خروجی داشته باشد، جای هر پارامتر را جدا دنبال کن.</p><p lang="en">Func&lt;string&gt; can be used as Func&lt;object&gt; because a specific output flows to a broader output. Action&lt;object&gt; can be used as Action&lt;string&gt; because it accepts the broader input. For signatures with several parameters, trace each position independently.</p></section>
<section id="limits"><h2><span lang="fa">variance کجا کار نمی‌کند؟</span><span lang="en">Where does variance not apply?</span></h2><p lang="fa">variance فقط روی generic interfaceها و delegateهایی کار می‌کند که خودشان in/out را اعلام کرده‌اند؛ generic class و struct از assignment variance پشتیبانی نمی‌کنند. تبدیل‌های variance به reference type arguments وابسته‌اند؛ مثلاً List<int> تبدیل covariant به List<object> نیست و value typeها را نمی‌توان با این قانون جایگزین کرد.</p><p lang="en">Variance applies only to generic interfaces and delegates that declare in/out; generic classes and structs do not support variant assignments. Variant conversions rely on reference-type arguments: List&lt;int&gt; does not become covariant List&lt;object&gt;, and value types do not substitute under this rule.</p><table><thead><tr><th lang="fa">نوع قرارداد</th><th lang="en">Contract shape</th><th lang="fa">جهت T</th><th lang="en">T direction</th></tr></thead><tbody><tr><td>IEnumerable&lt;out T&gt;</td><td>فقط تولید</td><td>covariant</td><td>Output</td></tr><tr><td>IComparer&lt;in T&gt;</td><td>فقط مصرف</td><td>contravariant</td><td>Input</td></tr><tr><td>List&lt;T&gt;</td><td>خواندن و نوشتن</td><td>invariant</td><td>Input and output</td></tr></tbody></table><p lang="fa">اگر interface هم T را برمی‌گرداند هم می‌پذیرد، معمولاً invariant می‌ماند. دو interface کوچک‌تر با جهت‌های جدا گاهی بهترند؛ ولی فقط برای رفع یک assignment عجیب interfaceهای تازه نساز—مصرف‌کنندهٔ واقعی و عملیاتش را ببین.</p><p lang="en">If an interface both returns and accepts T, it usually remains invariant. Two smaller interfaces with separate directions may fit, but do not invent interfaces merely to fix a puzzling assignment—inspect real consumers and operations.</p></section>
<section id="lab"><h2><span lang="fa">آزمایشگاه: source و handler را به هم وصل کن</span><span lang="en">Lab: connect a source and a handler</span></h2><p lang="fa">یک ISource<T> و IHandler<T> کوچک بساز. هر بار string و object را جایگزین کن و از روی جهت داده پیش‌بینی کن تبدیل امن است یا نه؛ بعد assignment را compile کن.</p><p lang="en">Build small ISource&lt;T&gt; and IHandler&lt;T&gt; contracts. Swap string and object at each assignment, predict safety from data direction, then compile it.</p><ol><li lang="fa">یک source از string بساز و خروجی را بخوان.</li><li lang="en">Create a string source and read its output.</li><li lang="fa">آن را به source از object assignment کن و علت امن‌بودن را بنویس.</li><li lang="en">Assign it to an object source and explain why it is safe.</li><li lang="fa">یک handler از object بساز و آن را در نقش handler از string استفاده کن.</li><li lang="en">Create an object handler and use it as a string handler.</li><li lang="fa">تبدیل برعکس را امتحان کن؛ خطای compiler را ثبت کن.</li><li lang="en">Try the reverse conversion and record the compiler error.</li><li lang="fa">دو List را در هر دو جهت assignment کن و invariance را ثابت کن.</li><li lang="en">Assign two Lists in both directions and prove invariance.</li><li lang="fa">Func و Action را با string/object آزمایش و جهت هر type parameter را برچسب بزن.</li><li lang="en">Test Func and Action with string/object and label each type parameter’s direction.</li><li lang="fa">یک interface که T را هم می‌گیرد هم می‌دهد طراحی کن؛ توضیح بده چرا invariant است.</li><li lang="en">Design an interface that both accepts and returns T; explain why it is invariant.</li></ol><div class="note safe"><div class="note-t"><span lang="fa">معیار پایان</span><span lang="en">Definition of done</span></div><p lang="fa">بدون حفظ‌کردن، از روی اینکه T تولید یا مصرف می‌شود جهت تبدیل را پیش‌بینی می‌کنی و می‌توانی دلیل رد یا قبول compiler را بگویی.</p><p lang="en">Without memorisation, you predict conversion direction from whether T is produced or consumed and explain compiler acceptance or rejection.</p></div></section>
<section id="exercises"><h2><span lang="fa">تمرین‌ها: جهت T را دنبال کن</span><span lang="en">Exercises: trace the direction of T</span></h2><p lang="fa">برای هر assignment بنویس: تولید، مصرف یا هر دو؟</p><p lang="en">For each assignment, label T as produced, consumed or both.</p>
<div class="ex" id="cs23-ex1"><h3><span lang="fa">۱) IEnumerable&lt;string&gt; به IEnumerable&lt;object&gt;</span><span lang="en">1) IEnumerable&lt;string&gt; to IEnumerable&lt;object&gt;</span></h3><p lang="fa">مجاز است؟ دلیل جهت‌دار بنویس.</p><p lang="en">Is it allowed? Explain from data direction.</p><details class="ex-sol"><summary><span lang="fa">پاسخ</span><span lang="en">Answer</span></summary><p lang="fa">بله؛ producer خاص‌تر برای خوانندهٔ عمومی‌تر امن است.</p><p lang="en">Yes; a specific producer is safe for a broader reader.</p></details></div>
<div class="ex" id="cs23-ex2"><h3><span lang="fa">۲) List&lt;string&gt; به List&lt;object&gt;</span><span lang="en">2) List&lt;string&gt; to List&lt;object&gt;</span></h3><p lang="fa">چرا compiler اجازه نمی‌دهد؟</p><p lang="en">Why does the compiler reject it?</p><details class="ex-sol"><summary><span lang="fa">پاسخ</span><span lang="en">Answer</span></summary><p lang="fa">List هم تولید و هم مصرف می‌کند؛ نوشتن object غیر string list اصلی را خراب می‌کند.</p><p lang="en">List both produces and consumes; writing a non-string object would corrupt the original list.</p></details></div>
<div class="ex" id="cs23-ex3"><h3><span lang="fa">۳) covariance را برچسب بزن</span><span lang="en">3) Label covariance</span></h3><p lang="fa">T در خروجی متد Get است یا ورودی؟</p><p lang="en">Is T in Get an output or input?</p><details class="ex-sol"><summary><span lang="fa">پاسخ</span><span lang="en">Answer</span></summary><p lang="fa">خروجی؛ out آن را covariant می‌کند.</p><p lang="en">Output; out makes it covariant.</p></details></div>
<div class="ex" id="cs23-ex4"><h3><span lang="fa">۴) contravariance را برچسب بزن</span><span lang="en">4) Label contravariance</span></h3><p lang="fa">T در Handle ورودی است یا خروجی؟</p><p lang="en">Is T in Handle an input or output?</p><details class="ex-sol"><summary><span lang="fa">پاسخ</span><span lang="en">Answer</span></summary><p lang="fa">ورودی؛ in آن را contravariant می‌کند.</p><p lang="en">Input; in makes it contravariant.</p></details></div>
<div class="ex" id="cs23-ex5"><h3><span lang="fa">۵) handler مخصوص string به handler object</span><span lang="en">5) String handler to object handler</span></h3><p lang="fa">آیا این assignment امن است؟</p><p lang="en">Is this assignment safe?</p><details class="ex-sol"><summary><span lang="fa">پاسخ</span><span lang="en">Answer</span></summary><p lang="fa">نه؛ caller مجاز object غیر string می‌دهد.</p><p lang="en">No; the caller may supply a non-string object.</p></details></div>
<div class="ex" id="cs23-ex6"><h3><span lang="fa">۶) Action&lt;object&gt; به Action&lt;string&gt;</span><span lang="en">6) Action&lt;object&gt; to Action&lt;string&gt;</span></h3><p lang="fa">چرا این جهت کار می‌کند؟</p><p lang="en">Why does this direction work?</p><details class="ex-sol"><summary><span lang="fa">پاسخ</span><span lang="en">Answer</span></summary><p lang="fa">مصرف‌کنندهٔ object هر string را هم می‌پذیرد؛ Action ورودی contravariant دارد.</p><p lang="en">An object consumer accepts every string; Action is contravariant in its input.</p></details></div>
<div class="ex" id="cs23-ex7"><h3><span lang="fa">۷) Func&lt;string&gt; به Func&lt;object&gt;</span><span lang="en">7) Func&lt;string&gt; to Func&lt;object&gt;</span></h3><p lang="fa">چرا تولیدکنندهٔ string قابل‌قبول است؟</p><p lang="en">Why is a string producer acceptable?</p><details class="ex-sol"><summary><span lang="fa">پاسخ</span><span lang="en">Answer</span></summary><p lang="fa">مصرف‌کنندهٔ خروجی object یک string را هم می‌تواند دریافت کند؛ نتیجه covariant است.</p><p lang="en">A consumer of object can receive a string; the result position is covariant.</p></details></div>
<div class="ex" id="cs23-ex8"><h3><span lang="fa">۸) class generic variance</span><span lang="en">8) Generic class variance</span></h3><p lang="fa">می‌توانی class Box&lt;out T&gt; بسازی؟</p><p lang="en">Can you declare class Box&lt;out T&gt;?</p><details class="ex-sol"><summary><span lang="fa">پاسخ</span><span lang="en">Answer</span></summary><p lang="fa">نه؛ variance declaration برای interfaceها و delegateهاست، نه class.</p><p lang="en">No; variance declarations apply to interfaces and delegates, not classes.</p></details></div>
<div class="ex" id="cs23-ex9"><h3><span lang="fa">۹) value type و variance</span><span lang="en">9) Value types and variance</span></h3><p lang="fa">آیا IEnumerable&lt;int&gt; با قانون covariance به IEnumerable&lt;object&gt; تبدیل می‌شود؟</p><p lang="en">Does IEnumerable&lt;int&gt; convert to IEnumerable&lt;object&gt; through covariance?</p><details class="ex-sol"><summary><span lang="fa">پاسخ</span><span lang="en">Answer</span></summary><p lang="fa">خیر؛ این variance conversion به reference type arguments متکی است.</p><p lang="en">No; this variance conversion relies on reference-type arguments.</p></details></div>
<div class="ex" id="cs23-ex10"><h3><span lang="fa">۱۰) T هم read و هم write</span><span lang="en">10) T is both read and written</span></h3><p lang="fa">یک interface List-like با get و Add(T) چه جهتی دارد؟</p><p lang="en">What variance can a List-like interface with get and Add(T) use?</p><details class="ex-sol"><summary><span lang="fa">پاسخ</span><span lang="en">Answer</span></summary><p lang="fa">invariant؛ T در خروجی و ورودی است.</p><p lang="en">Invariant; T appears in both output and input.</p></details></div>
<div class="ex" id="cs23-ex11"><h3><span lang="fa">۱۱) comparer</span><span lang="en">11) Comparer</span></h3><p lang="fa">IComparer&lt;in T&gt; مصرف‌کننده است یا تولیدکننده؟</p><p lang="en">Is IComparer&lt;in T&gt; a consumer or producer?</p><details class="ex-sol"><summary><span lang="fa">پاسخ</span><span lang="en">Answer</span></summary><p lang="fa">ورودی T را در Compare می‌گیرد، پس contravariant است.</p><p lang="en">It consumes T in Compare, so it is contravariant.</p></details></div>
<div class="ex" id="cs23-ex12"><h3><span lang="fa">۱۲) interface دوطرفه</span><span lang="en">12) A two-way interface</span></h3><p lang="fa">برای ICache&lt;T&gt; که Get می‌دهد و Put می‌گیرد چه نتیجه‌ای می‌گیری؟</p><p lang="en">What do you conclude for ICache&lt;T&gt; that returns Get and accepts Put?</p><details class="ex-sol"><summary><span lang="fa">پاسخ</span><span lang="en">Answer</span></summary><p lang="fa">invariant؛ یا اگر مصرف‌کننده‌ها جدا هستند interfaceهای خواندن/نوشتن را تفکیک کن.</p><p lang="en">Invariant; split read and write interfaces if consumers need separate capabilities.</p></details></div>
<div class="ex" id="cs23-ex13"><h3><span lang="fa">۱۳) reverse the conversion</span><span lang="en">13) Reverse the conversion</span></h3><p lang="fa">چرا ISource&lt;object&gt; را نمی‌توان به ISource&lt;string&gt; assign کرد؟</p><p lang="en">Why can’t ISource&lt;object&gt; be assigned to ISource&lt;string&gt;?</p><details class="ex-sol"><summary><span lang="fa">پاسخ</span><span lang="en">Answer</span></summary><p lang="fa">ممکن است منبع object مقادیری غیر از string تولید کند.</p><p lang="en">An object source may produce values that are not strings.</p></details></div>
<div class="ex" id="cs23-ex14"><h3><span lang="fa">۱۴) ticket assignment</span><span lang="en">14) The assignment ticket</span></h3><p lang="fa">همکار List&lt;Dog&gt; را به IEnumerable&lt;Animal&gt; تبدیل نمی‌تواند کند؛ آیا compiler خراب است؟</p><p lang="en">A teammate cannot assign List&lt;Dog&gt; to IEnumerable&lt;Animal&gt;. Is the compiler broken?</p><details class="ex-sol"><summary><span lang="fa">مسیر تشخیص</span><span lang="en">Diagnosis path</span></summary><p lang="fa">بررسی کن Dog واقعاً Animal را ارث می‌برد؛ سپس تبدیل به interface covariant IEnumerable را آزمایش کن. اگر متغیر مقصد List&lt;Animal&gt; است، تبدیل مجاز نیست چون مقصد امکان نوشتن Animal غیر Dog دارد.</p><p lang="en">Verify Dog derives from Animal, then test the covariant IEnumerable conversion. If the target is List&lt;Animal&gt;, it is invalid because that target could accept an Animal that is not a Dog.</p></details></div></section>
<section id="takeaway"><h2><span lang="fa">از جهت مصرف و تولید تصمیم بگیر</span><span lang="en">Decide from input and output direction</span></h2><p lang="fa">out برای تولیدکنندهٔ T و تبدیل به قرارداد عمومی‌تر؛ in برای مصرف‌کنندهٔ T و استفادهٔ مصرف‌کنندهٔ عمومی‌تر در جای خاص‌تر؛ هر دو جهت یعنی invariant. فقط interface و delegateهای variant پشتیبانی می‌شوند و value typeها استثنای مهم‌اند. بعد از این، فصل بعد سراغ constraints پیشرفته‌تر یا طراحی genericهای دنیای واقعی می‌رویم؟ مسیر مصوب دوره را دنبال می‌کنیم: الگوریتم‌های generic را با collectionها و APIهای کاربردی می‌سنجیم.</p><p lang="en">out suits a producer of T and conversion to a broader contract; in suits a consumer of T and lets a broader consumer stand in for a narrower one; both directions mean invariance. Only variant interfaces and delegates support it, with value types as an important exception. Next we apply generic design to practical collection and API problems.</p></section>
