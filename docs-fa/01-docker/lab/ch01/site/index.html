<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اولین کانتینر من</title>
<style>
  :root{color-scheme:light dark}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    font-family:'Vazirmatn',system-ui,'Segoe UI',Tahoma,sans-serif;
    background:#0E1524;color:#E9EEF9;line-height:1.9;
  }
  .card{
    max-width:520px;padding:34px 32px;border-radius:20px;
    background:#111828;border:1px solid rgba(255,255,255,.1);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.8);
  }
  h1{margin:0 0 10px;font-size:1.6rem;line-height:1.5}
  .who{color:#7D94FF;font-weight:700}
  p{margin:0 0 14px;color:#9CA9C6}
  code{
    font-family:'JetBrains Mono',Consolas,monospace;font-size:.86em;direction:ltr;
    background:rgba(125,148,255,.14);color:#7D94FF;padding:2px 7px;border-radius:6px;
  }
  .bar{height:3px;border-radius:99px;background:linear-gradient(120deg,#6C86FF,#A98BFA);margin-bottom:22px}
</style>
</head>
<body>
  <div class="card">
    <div class="bar"></div>
    <h1>این صفحه از داخل یک کانتینر می‌آید</h1>

    <!-- ↓↓↓ اسم خودت را اینجا بگذار ↓↓↓ -->
    <p>سرو شده توسط <span class="who">نام تو</span> — فصل ۱ مرجع داکر.</p>

    <p>
      این فایل روی سیستم تو نوشته شد، بعد با <code>docker cp</code> داخل کانتینر
      کپی شد. خود ایمیج <code>nginx</code> ذره‌ای تغییر نکرده است.
    </p>
    <p>
      برای اینکه ببینی چه چیزی نسبت به ایمیج عوض شده:
      <code>docker diff ch01-site</code>
    </p>
  </div>
</body>
</html>
